/** 【foxLocal 专用】模板重上色的辅助函数。 */
class FoxLocalKit {
    /** 在重锋 jar 里读一张图(PNG)。 */
    static java.awt.image.BufferedImage readImage(File jarFile, String entry) {
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def e = zip.getEntry(entry)
            if (e == null) {
                throw new IllegalStateException("${jarFile.name} 里没有 ${entry}")
            }
            def img = javax.imageio.ImageIO.read(zip.getInputStream(e))
            if (img == null) {
                throw new IllegalStateException("${entry} 不是可读图片")
            }
            return img
        } finally {
            zip.close()
        }
    }
}

/** 【foxLocal 专用】重上色 / 覆盖纹样的操作(独立类,避免改动既有 FoxTex)。 */
class FoxLocalOps {
    /** 保留原图明暗结构,把颜色换成给定梯级(线性插值 + 细节偏移)。 */
    static java.awt.image.BufferedImage remapToPalette(java.awt.image.BufferedImage src, List ramp) {
        int w = src.getWidth()
        int h = src.getHeight()
        def out = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_RGB)
        for (int y = 0; y < h; y++) {
            for (int x = 0; x < w; x++) {
                def c = new java.awt.Color(src.getRGB(x, y), false)
                double lum = (0.299d * c.red + 0.587d * c.green + 0.114d * c.blue) / 255.0d
                int lo = 0
                while (lo < ramp.size() - 2 && lum > (ramp[lo + 1][0] as double)) {
                    lo++
                }
                double a0 = ramp[lo][0] as double
                double a1 = ramp[lo + 1][0] as double
                double t = (lum - a0) / Math.max(1.0e-6d, a1 - a0)
                int[] c0 = ramp[lo][1] as int[]
                int[] c1 = ramp[lo + 1][1] as int[]
                double baseLum = 255.0d * (a0 + (a1 - a0) * t)
                double detail = (0.299d * c.red + 0.587d * c.green + 0.114d * c.blue) - baseLum
                int r = (int) Math.round(c0[0] + (c1[0] - c0[0]) * t + detail * 0.25d)
                int g = (int) Math.round(c0[1] + (c1[1] - c0[1]) * t + detail * 0.25d)
                int b = (int) Math.round(c0[2] + (c1[2] - c0[2]) * t + detail * 0.25d)
                out.setRGB(x, y, new java.awt.Color(
                        Math.max(0, Math.min(255, r)),
                        Math.max(0, Math.min(255, g)),
                        Math.max(0, Math.min(255, b))).getRGB())
            }
        }
        return out
    }

    /** 某一组掩码里最大的长条岛。 */
    static Object biggestStrip(boolean[] mask, int w, int h) {
        def strips = FoxTex.islands(mask, w, h).findAll { FoxTex.classify(it) == 'strip' }
        if (strips.isEmpty()) {
            return null
        }
        return strips.max { it.pixels.size() }
    }

    /** 把 source 沿长度**平铺** repeat 段铺进岛内(alpha<128 的源像素不动,保留底色)。 */
    static void overlayTile(java.awt.image.BufferedImage canvas, Object island,
                            java.awt.image.BufferedImage source, int repeat) {
        def isl = island
        int W = canvas.getWidth()
        int bw = Math.max(1, (isl.x1 as int) - (isl.x0 as int) + 1)
        int bh = Math.max(1, (isl.y1 as int) - (isl.y0 as int) + 1)
        int sw = source.getWidth()
        int sh = source.getHeight()
        (isl.pixels as List<Integer>).each { idx ->
            int x = idx % W
            int y = (int) (idx / W)
            double u = (x - (isl.x0 as int)) / (double) bw
            double v = (((y - (isl.y0 as int)) / (double) bh) * repeat) % 1.0d
            int sx = (int) Math.max(0, Math.min(sw - 1, Math.round(u * (sw - 1))))
            int sy = (int) Math.max(0, Math.min(sh - 1, Math.round(v * (sh - 1))))
            def c = new java.awt.Color(source.getRGB(sx, sy), true)
            if (c.alpha >= 128) {
                canvas.setRGB(x, y, new java.awt.Color(c.red, c.green, c.blue).getRGB())
            }
        }
    }

    /** 取 source 中心区域,按 contain 居中铺进岛内(alpha<128 不动)。 */
    static void overlayCentred(java.awt.image.BufferedImage canvas, Object island,
                               java.awt.image.BufferedImage source) {
        def isl = island
        int W = canvas.getWidth()
        int bw = Math.max(1, (isl.x1 as int) - (isl.x0 as int) + 1)
        int bh = Math.max(1, (isl.y1 as int) - (isl.y0 as int) + 1)
        int sw = source.getWidth()
        int sh = source.getHeight()
        // 源图中心 80% 方形(避开边缘留白)
        int cx0 = (int) (sw * 0.10d)
        int cx1 = (int) (sw * 0.90d)
        int cy0 = (int) (sh * 0.10d)
        int cy1 = (int) (sh * 0.90d)
        (isl.pixels as List<Integer>).each { idx ->
            int x = idx % W
            int y = (int) (idx / W)
            double u = (x - (isl.x0 as int)) / (double) bw
            double v = (y - (isl.y0 as int)) / (double) bh
            int sx = (int) Math.round(cx0 + u * (cx1 - cx0))
            int sy = (int) Math.round(cy0 + v * (cy1 - cy0))
            def c = new java.awt.Color(source.getRGB(
                    Math.max(0, Math.min(sw - 1, sx)), Math.max(0, Math.min(sh - 1, sy))), true)
            if (c.alpha >= 128) {
                canvas.setRGB(x, y, new java.awt.Color(c.red, c.green, c.blue).getRGB())
            }
        }
    }
}

