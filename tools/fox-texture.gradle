// ----------------------------------------------------------------------------
// 任务:foxCheck -PfoxTex=<png> —— 回读自检:透明/近黑像素是否落在各组的采样范围内
// ----------------------------------------------------------------------------
// 这是"贴图能不能用"的硬判据:只要某个组的 UV 落在透明像素上,游戏里那部分就会变黑/变透明;
// 而 effect 组覆盖整张贴图的约 75%,所以"整张必须不透明"基本等价于"可用"。
// ----------------------------------------------------------------------------
def foxCheckJar = fileTree(dir: 'libs', include: ['slashblade-*.jar']).files.sort { it.name }.reverse().first()
def foxCheckTex = project.hasProperty('foxTex')
        ? new File(project.projectDir, project.property('foxTex').toString())
        : null

tasks.register('foxCheck') {
    group = 'applied slash tooling'
    description = '回读自检:检查给定贴图在每组 UV 范围内是否有透明/近黑像素(-PfoxTex=路径)'
    notCompatibleWithConfigurationCache('本任务在 doLast 里读图并计算')

    doLast {
        System.setProperty('java.awt.headless', 'true')
        if (foxCheckTex == null || !foxCheckTex.isFile()) {
            throw new GradleException('用法: gradlew foxCheck -PfoxTex=<贴图路径>')
        }
        def img = javax.imageio.ImageIO.read(foxCheckTex)
        if (img == null) {
            throw new GradleException("不是可读图片: ${foxCheckTex}")
        }
        int W = img.getWidth()
        int H = img.getHeight()
        double scale = W / (double) FoxLayout.SRC_W
        def groups = (FoxObj.parse(FoxObj.readLines(foxCheckJar, FOX_MODEL_ENTRY), W, H).groups
                as Map<String, List<List<int[]>>>)
        println '===== foxCheck ====='
        println String.format(Locale.ROOT, '  贴图      : %s  %d×%d(≈ %.2f× @192×384)', foxCheckTex.name, W, H, scale)
        // 整图统计
        int tot = 0
        int trans = 0
        int black = 0
        for (int y = 0; y < H; y += 2) {
            for (int x = 0; x < W; x += 2) {
                def c = new java.awt.Color(img.getRGB(x, y), true)
                tot++
                if (c.alpha < 128) { trans++ }
                else if (c.red < 24 && c.green < 24 && c.blue < 24) { black++ }
            }
        }
        println String.format(Locale.ROOT, '  整图      : 透明 %.2f%%   近黑 %.2f%%', 100.0d * trans / tot, 100.0d * black / tot)
        println '  逐组检查(该组 UV 范围内的像素):'
        def bad = []
        groups.keySet().sort().each { g ->
            boolean[] mask = FoxUvMap.mask(groups[g], W, H)
            int n = 0
            int t = 0          // alpha < 128
            int art = 0        // alpha < 128 但 RGB 非黑(重锋不吃 alpha,这类是"有效内容")
            int b = 0          // RGB 近黑(真正会变黑的像素,与 alpha 无关)
            for (int i = 0; i < mask.length; i++) {
                if (!mask[i]) { continue }
                n++
                def c = new java.awt.Color(img.getRGB(i % W, (int) (i / W)), true)
                int rgbSum = c.red + c.green + c.blue
                boolean blackRgb = c.red < 24 && c.green < 24 && c.blue < 24
                if (c.alpha < 128) {
                    t++
                    if (!blackRgb) { art++ }
                }
                if (blackRgb) { b++ }
            }
            double tp = n == 0 ? 0.0d : 100.0d * t / n
            double ap = n == 0 ? 0.0d : 100.0d * art / n
            double bp = n == 0 ? 0.0d : 100.0d * b / n
            String verdict = bp > 5.0d ? '不通过(大面积纯黑)' : 'OK'
            println String.format(Locale.ROOT, '    %-16s 采样 %7d  alpha<128 %6.2f%%(其中非黑 %6.2f%%)  RGB纯黑 %6.2f%%   %s',
                    g, n, tp, ap, bp, verdict)
            if (bp > 5.0d) { bad << g }
        }
        println bad.isEmpty()
                ? '  结论      : 可用(没有任何组出现大面积纯黑采样)'
                : "  结论      : 不可用 —— 这些组会大面积变黑: ${bad.join(', ')}"
        println '===== 结束 ====='
    }
}
