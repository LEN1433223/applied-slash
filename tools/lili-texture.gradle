// 路径在**配置期**取好:doLast 里访问 project 会让配置缓存无法保存(本仓库既有约定)
def liliAssetDir = new File(project.projectDir, 'src/main/resources/assets/applied_slash/models/lili')
def liliObjFile = new File(liliAssetDir, 'lili.obj')
def liliTargetPng = new File(liliAssetDir, 'lili.png')
def liliSourcePng = new File(project.projectDir, 'art/lili_source.png')
def liliSourceObj = new File(project.projectDir, 'art/lili_source.obj')
def liliPreviewDir = new File(project.projectDir, 'build/lili-texture-preview')

/** 颜色参数:`-PsayaBase=ECE2E7` 之类;默认 = 象牙白底 + 亮金箍(用户选定)。 */
static Color pickColour(Object v, String fallback) {
    String s = v == null ? fallback : v.toString().replace('#', '').trim()
    if (s.isEmpty()) {
        return null
    }
    return new Color(Integer.parseInt(s, 16))
}

// 参数在**配置期**读好(与路径同理:doLast 里访问 project 会让配置缓存报 8 处问题)
def sayaBaseProp = project.findProperty('sayaBase')
def sayaEdgeProp = project.findProperty('sayaEdge')
def sayaTrimProp = project.findProperty('sayaTrim')
def sayaOutlineProp = project.findProperty('sayaOutline')
def sayaGradientProp = project.findProperty('sayaGradient')
def sayaKojiFracProp = project.findProperty('sayaKojiFrac')
def sayaMouthFracProp = project.findProperty('sayaMouthFrac')
def sayaRestoreProp = project.hasProperty('sayaRestore')
/** 整张贴图的整数放大倍数(2 ⇒ 512×1024,鞘的可用像素 ×4)。 */
def sayaScaleProp = project.findProperty('sayaScale')
/** AI 鞘纹样:显式指定 `-PsayaArt=...`,或默认读取 art/saya_ai.png(存在就用)。 */
def sayaArtProp = project.findProperty('sayaArt')
def sayaArtFile = new File(project.projectDir, sayaArtProp != null ? sayaArtProp.toString() : 'art/saya_ai.png')
def cropBottomProp = (project.findProperty('sayaArtCropBottom') ?: '0') as int
/** 底部去水印方式:默认镜像替换(不损失长度);-PsayaArtHardCrop 改成直接裁掉。 */
def mirrorPadProp = !project.hasProperty('sayaArtHardCrop')
/** 金箍:回退版默认打开(用户最后确认过的观感);-PsayaTrimOff 关闭。 */
def trimOffProp = project.hasProperty('sayaTrimOff')
/** 线稿专用降采样(逐通道 min 保住细线);-PsayaArtMinPool 打开。 */
def minPoolProp = project.hasProperty('sayaArtMinPool')
/** 叠层数(回退版默认 1 = 不叠,保留原始花纹的疏密)。 */
def layersProp = ((project.findProperty('sayaArtLayers') ?: '1') as int)

tasks.register('generateLiliTexture') {
    group = 'applied slash tooling'
    description = '只重绘莉莉刀鞘的贴图像素(象牙白 + 金箍);不动几何/UV,掩码外像素逐字节不变'
    notCompatibleWithConfigurationCache('本任务在 doLast 里读 OBJ/PNG 并写资源文件')

    doLast {
        System.setProperty('java.awt.headless', 'true')

        if (sayaRestoreProp) {
            liliTargetPng.bytes = liliSourcePng.bytes
            println "===== generateLiliTexture ====="
            println "  已从 ${liliSourcePng} 还原 ${liliTargetPng}(原始丛雨丸像素)"
            return
        }

        if (!liliSourcePng.isFile()) {
            throw new GradleException("缺少原始贴图存档 ${liliSourcePng}(它必须存在,否则无法回滚/重绘)")
        }

        def base = pickColour(sayaBaseProp, 'F4EEEA')
        def edge = pickColour(sayaEdgeProp, 'E2D8D4')
        def trim = pickColour(sayaTrimProp, 'F7C948')
        def outline = pickColour(sayaOutlineProp, '')
        double gradient = (sayaGradientProp ?: '0.18') as double
        double kojiFrac = (sayaKojiFracProp ?: '0.08') as double
        double mouthFrac = (sayaMouthFracProp ?: '0.05') as double

        def raw0 = ImageIO.read(liliSourcePng)
        // 图集重排:原始素材 2× 最近邻放大后放进右上象限(1024×2048)。
        // 其它 7 组的 UV 在几何侧已做同一套仿射变换(u' = 0.5u + 0.5, v' = 0.5v)⇒ 外观一个像素都不变。
        def src = AtlasBase.build(raw0)
        int w = src.getWidth()
        int h = src.getHeight()
        def obj = LiliSayaTexture.read(liliObjFile)

        def sheathFaces = obj.groups['sheath'] ?: []
        def protectFaces = []
        LiliSayaTexture.PROTECT_GROUPS.each { g ->
            def list = obj.groups[g]
            if (list != null) {
                protectFaces.addAll(list)
            }
        }
        def mouthFaces = []
        sheathFaces.each { f ->
            if (f.uCentroid > LiliSayaTexture.MOUTH_U) {
                mouthFaces << f
            }
        }

        boolean[] sheathMask = LiliSayaTexture.rasterize(sheathFaces, w, h)
        boolean[] protectMask = LiliSayaTexture.rasterize(protectFaces, w, h)
        boolean[] mouthMask = LiliSayaTexture.rasterize(mouthFaces, w, h)
        boolean[] paint = new boolean[w * h]
        int paintCount = 0
        int protectedCount = 0
        double tMin = 1.0d
        double tMax = 0.0d
        int rowMin = h
        int rowMax = 0
        for (int y = 0; y < h; y++) {
            double t = LiliSayaTexture.tOfV(1.0d - (y / (double) (h - 1)))
            for (int x = 0; x < w; x++) {
                int i = y * w + x
                if (sheathMask[i] && !protectMask[i]) {
                    paint[i] = true
                    paintCount++
                    tMin = Math.min(tMin, t)
                    tMax = Math.max(tMax, t)
                    rowMin = Math.min(rowMin, y)
                    rowMax = Math.max(rowMax, y)
                } else if (sheathMask[i]) {
                    protectedCount++
                }
            }
        }
        // 金箍位置**从实际被画到的 t 区间反推** —— 网格裁剪后(鞘上的金属环/栗形/下绪被删),
        // 旧的"固定比例"会落在没人采样的行上,变成看不见的像素;
        // 只有落在 [tMin, tMax] 里的箍才会被真正留下的面取到。
        // 金箍阈值**按采样行(鞘长)直接算**:低行 = 鞘尻(尖端),高行 = 鞘口。
        // 不要用 t:row↔t 的映射在两端被钳制且非线性,写"8%"会占掉 20%~30% 的鞘长(实测)。
        double bandLo = (rowMin + kojiFrac * (rowMax - rowMin)) / (double) (h - 1)
        double bandHi = (rowMax - mouthFrac * (rowMax - rowMin)) / (double) (h - 1)

        // ---- 可选:导入 AI 鞘纹样(默认 gundam:art/saya_ai.png 存在就用)----
        // 映射关系由实测决定:横向 = 绕鞘一周(u)、纵向 = 鞘长(采样行),纹样铺满该矩形。
        int[] region = SayaArt.regionOf(sheathFaces, w, h)
        BufferedImage art = null
        double artSeamBefore = 0.0d
        double artSeamAfter = 0.0d
        double artInk = 0.0d
        if (sayaArtFile.isFile()) {
            def rawArt = ImageIO.read(sayaArtFile)
            artSeamBefore = SayaArt.seamError(rawArt)
            int rw = Math.max(2, region[2] - region[0] + 1)
            int rh = Math.max(2, region[3] - region[1] + 1)
            art = SayaArt.prepare(sayaArtFile, rw, rh, cropBottomProp as int, mirrorPadProp, layersProp, minPoolProp)
            artSeamAfter = SayaArt.seamError(art)
            artInk = SayaArt.inkShare(art)
        } else if (sayaArtProp != null) {
            println "  [注意] 指定的 AI 纹样不存在: ${sayaArtFile}(本次用程序渐变)"
        }

        // 金箍:回退版**默认打开**(与用户最后确认过的观感一致);-PsayaTrimOff 可关闭
        Color trimColour = trimOffProp ? null : trim
        def out = SayaTint.apply(src, paint, mouthMask, base, edge, trimColour, bandLo, bandHi, outline, art, region)
        ImageIO.write(out, 'png', liliTargetPng)

        // ---- 预览 ----
        LiliSayaTexture.writeMaskOverlay(new File(liliPreviewDir, 'mask-overlay-2x.png'), src, paint, protectMask, w, h, 2)
        LiliSayaTexture.writeCrop(new File(liliPreviewDir, 'retinted-main-2x.png'), out, 0, 0, 128, h, 2)
        LiliSayaTexture.writeCrop(new File(liliPreviewDir, 'retinted-mouth-8x.png'), out, 216, 80, 40, 48, 8)
        LiliSayaTexture.writeSideBySide(new File(liliPreviewDir, 'scale-icon-16px-per-block.png'), [
                SayaProjection.render(obj, ['blade', 'blade_damaged'], src, 0.05d, 10, 120),
                SayaProjection.render(obj, ['blade', 'blade_damaged', 'sheath'], out, 0.05d, 10, 120)])
        LiliSayaTexture.writeSideBySide(new File(liliPreviewDir, 'scale-stand-80px-per-block.png'), [
                SayaProjection.render(obj, ['blade', 'blade_damaged'], src, 0.25d, 4, 120),
                SayaProjection.render(obj, ['blade', 'blade_damaged', 'sheath'], out, 0.25d, 4, 120),
                SayaProjection.render(obj, ['sheath'], out, 0.25d, 4, 120)])
        // 删前 / 删后:**用原始模型 + 原始贴图**对照当前网格 + 当前贴图,同尺度并排
        if (liliSourceObj.isFile()) {
            def srcObj = LiliSayaTexture.read(liliSourceObj)
            LiliSayaTexture.writeSideBySide(new File(liliPreviewDir, 'mesh-before-after.png'), [
                    SayaProjection.render(srcObj, ['blade', 'blade_damaged', 'sheath'], src, 0.25d, 4, 120),
                    SayaProjection.render(obj, ['blade', 'blade_damaged', 'sheath'], out, 0.25d, 4, 120)])
        }

        // ---- 统计(判读用)----
        int trimCount = 0
        int ivoryCount = 0
        for (int y = 0; y < h; y++) {
            double row = y / (double) (h - 1)
            for (int x = 0; x < w; x++) {
                int i = y * w + x
                if (!paint[i]) {
                    continue
                }
                if (mouthMask[i] || row <= bandLo || row >= bandHi) {
                    trimCount++
                } else {
                    ivoryCount++
                }
            }
        }
        println '===== generateLiliTexture ====='
        println "  源图      : ${liliSourcePng}(${liliSourcePng.length()} B,不可变)"
        println "  产物      : ${liliTargetPng}(${liliTargetPng.length()} B)"
        println String.format(Locale.ROOT, '  象牙白底  : #%02X%02X%02X → #%02X%02X%02X(渐变 %.2f,鞘口亮/鞘尻暗)',
                base.red, base.green, base.blue, edge.red, edge.green, edge.blue, gradient)
        println String.format(Locale.ROOT, '  金箍      : %s',
                trimOffProp ? '关闭(-PsayaTrimOff 生效)'
                        : String.format('#%02X%02X%02X(鞘尻端 %.0f%% + 鞘口端 %.0f%%,按鞘长)', trim.red, trim.green, trim.blue, kojiFrac * 100.0d, mouthFrac * 100.0d))
        println String.format(Locale.ROOT, '  金箍阈值  : 按鞘长(采样行)直接算:行 ∈ [%d, %d] ⇒ 箍在行 ≤ %.3f 与行 ≥ %.3f(各占鞘长 %.0f%% / %.0f%%)',
                rowMin, rowMax, bandLo, bandHi, kojiFrac * 100.0d, mouthFrac * 100.0d)
        println String.format(Locale.ROOT, '  图集      : %d×%d(原始素材 %d× 放大放在 %d,%d;鞘的区域由几何反推)',
                w, h, LiliAtlasLayout.ORIG_SCALE, LiliAtlasLayout.ORIG_X, LiliAtlasLayout.ORIG_Y)
        println String.format(Locale.ROOT, '  鞘的 UV 区域: x[%d, %d] y[%d, %d] = %d×%d px(比例 1:%.1f;鞘周长 31.7 / 长 260.8 ⇒ 理想 1:8.2)',
                region[0], region[2], region[1], region[3], region[2] - region[0] + 1, region[3] - region[1] + 1,
                (region[3] - region[1] + 1) / (double) (region[2] - region[0] + 1))
        if (art != null) {
            println String.format(Locale.ROOT, '  AI 纹样    : %s(底部 %d px %s;统一缩放+水平镜像+%d 层;接缝色差 %.1f → %.1f;纹样非底色占比 %.1f%%)',
                    sayaArtFile.name, cropBottomProp, mirrorPadProp ? '镜像替换去水印' : '直接裁掉',
                    layersProp, artSeamBefore, artSeamAfter, artInk * 100.0d) + (minPoolProp ? ',线稿 min 池化' : '')
        } else {
            println '  AI 纹样    : 未使用(程序渐变;放 art/saya_ai.png 或用 -PsayaArt=... 即可启用)'
        }
        println "  轮廓      : ${outline == null ? '关闭' : String.format('#%02X%02X%02X', outline.red, outline.green, outline.blue)}"
        println "  鞘掩码    : ${LiliSayaTexture.count(sheathMask)} px(占贴图 ${(100.0d * LiliSayaTexture.count(sheathMask) / (w * h)).round(1)}%)"
        println "  保护集    : ${protectedCount} px 与刀身共用 ⇒ 一个像素都不改"
        println "  上色      : ${paintCount} px(纹样/底色 ${ivoryCount} + 金箍 ${trimCount})"
        println "  鞘口段面数: ${mouthFaces.size()} / ${sheathFaces.size()}(u 重心 > ${LiliSayaTexture.MOUTH_U})"
        println "  预览      : ${liliPreviewDir}"
        println '===== 结束(断言在 verifyResources:鞘身亮度、金像素数、掩码外零改动)====='
    }
}
