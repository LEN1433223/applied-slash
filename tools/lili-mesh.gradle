tasks.register('liliPartsMap') {
    group = 'applied slash tooling'
    description = '把世界姿态各组的连通块各画一种颜色并输出编号对照表(以后指编号即可)'
    notCompatibleWithConfigurationCache('本任务在 doLast 里读 OBJ 并写预览图')

    doLast {
        System.setProperty('java.awt.headless', 'true')
        def lines = liliObjTarget.readLines('UTF-8')
        def body = lines.dropWhile { it.startsWith('#') }
        def byGroupAll = LiliMesh.readFaces(body)
        def verts = LiliMesh.readVertices(body)
        def byGroup = [:]
        ['blade', 'blade_damaged', 'blade_fragment', 'effect', 'sheath'].each { g ->
            if (byGroupAll[g] != null) {
                byGroup[g] = byGroupAll[g]
            }
        }
        def legend = []
        def mapFile = new File(liliMeshPreviewDir, 'parts-map.png')
        LiliPartsMap.render(mapFile, byGroup, verts, legend, 2.0d, 2, 120)
        def txt = new StringBuilder('# parts-map 编号对照(侧视图,世界坐标)\n')
        txt.append('# 编号  组名            面数   包围盒\n')
        legend.each { row -> txt.append(String.format(Locale.ROOT, '  %-4s  %-14s  %-5s  %s%n', row[0], row[1], row[2], row[3])) }
        new File(liliMeshPreviewDir, 'parts-map.txt').setText(txt.toString(), 'UTF-8')
        println '===== liliPartsMap ====='
        println "  图  : ${mapFile}(${legend.size()} 块)"
        legend.each { row -> println "    #${row[0]}  ${row[1]}  面 ${row[2]}  ${row[3]}" }
        println '===== 结束 ====='
    }
}

/**
 * 「分解图」:把每个组切成连通块,每块一种颜色画成侧视图,并输出编号对照表。
 *
 * <p>用途:以后你说"去掉某一块"时,直接指图上的编号即可 —— 不必再靠猜坐标或面数。
 */
class LiliPartsMap {
    static final int[] PALETTE = [
            0xFFE64D4D, 0xFF4DA6E6, 0xFF66CC66, 0xFFE6C34D, 0xFFB266E6, 0xFF4DE6D9,
            0xFFE68A4D, 0xFF8AE64D, 0xFFE64DB2, 0xFF4D5AE6, 0xFF9EE64D, 0xFFE64DE6,
            0xFF4DE68A, 0xFFE6E64D, 0xFF4D8AE6, 0xFFE64D8A]

    static void render(File out, Map<String, List<MeshFace>> byGroup, List<double[]> verts,
                       List<List<String>> legendRows, double pxPerUnit, int zoom, int canvasHeightUnits) {
        def items = []
        int nextColour = 0
        byGroup.each { group, faces ->
            def comps = LiliMesh.components(faces, verts)
            comps.eachWithIndex { comp, ci ->
                items << [faces: comp, colour: nextColour % PALETTE.length, group: group, index: ci]
                double lo = Double.MAX_VALUE
                double hi = -Double.MAX_VALUE
                double ylo = Double.MAX_VALUE
                double yhi = -Double.MAX_VALUE
                comp.each { face ->
                    face.vertexIndices.each { v ->
                        lo = Math.min(lo, verts[v][0]); hi = Math.max(hi, verts[v][0])
                        ylo = Math.min(ylo, verts[v][1]); yhi = Math.max(yhi, verts[v][1])
                    }
                }
                legendRows << ([String.valueOf(nextColour + 1), group, String.valueOf(comp.size()),
                               String.format(Locale.ROOT, 'X[%.1f, %.1f] Y[%.1f, %.1f]', lo, hi, ylo, yhi)] as List<String>)
                nextColour++
            }
        }

        int cw = (int) Math.ceil(360.0d * pxPerUnit) + 8
        int ch = (int) Math.ceil(canvasHeightUnits * pxPerUnit) + 8
        def small = new java.awt.image.BufferedImage(cw, ch, java.awt.image.BufferedImage.TYPE_INT_RGB)
        def g = small.createGraphics()
        g.setColor(new java.awt.Color(30, 30, 36))
        g.fillRect(0, 0, cw, ch)
        double ox = cw - 4.0d
        double oy = ch * 0.55d
        def allFaces = []
        items.each { item ->
            item.faces.each { face ->
                double depth = 0.0d
                face.vertexIndices.each { depth += verts[it][2] }
                allFaces << [face: face, depth: depth / face.vertexIndices.size(), colour: item.colour]
            }
        }
        allFaces.sort { a, b -> (a.depth as double) <=> (b.depth as double) }
        allFaces.each { entry ->
            def xs = entry.face.vertexIndices.collect { (int) Math.floor(ox + (verts[it][0] - 41.7d) * pxPerUnit) } as int[]
            def ys = entry.face.vertexIndices.collect { (int) Math.floor(oy - verts[it][1] * pxPerUnit) } as int[]
            g.setColor(new java.awt.Color(PALETTE[entry.colour as int], true))
            g.fillPolygon(xs, ys, xs.length)
        }
        items.each { item ->
            double cx = 0.0d
            double cy = 0.0d
            int n = 0
            item.faces.each { face ->
                face.vertexIndices.each { v ->
                    cx += verts[v][0]; cy += verts[v][1]; n++
                }
            }
            if (n == 0) {
                return
            }
            cx /= n
            cy /= n
            int sx = (int) Math.floor(ox + (cx - 41.7d) * pxPerUnit)
            int sy = (int) Math.floor(oy - cy * pxPerUnit)
            g.setFont(new java.awt.Font('SansSerif', java.awt.Font.BOLD, 11))
            g.setColor(new java.awt.Color(20, 20, 24))
            g.drawString(String.valueOf(item.colour + 1), sx + 1, sy + 1)
            g.setColor(java.awt.Color.WHITE)
            g.drawString(String.valueOf(item.colour + 1), sx, sy)
        }
        g.dispose()
        def big = new java.awt.image.BufferedImage(cw * zoom, ch * zoom, java.awt.image.BufferedImage.TYPE_INT_RGB)
        def g2 = big.createGraphics()
        g2.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
        g2.drawImage(small, 0, 0, cw * zoom, ch * zoom, null)
        g2.dispose()
        out.parentFile.mkdirs()
        javax.imageio.ImageIO.write(big, 'png', out)
    }
}
