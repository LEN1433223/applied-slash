def liliDir0 = new File(project.projectDir, 'src/main/resources/assets/applied_slash/models/lili')
def liliObjTarget = new File(liliDir0, 'lili.obj')
def liliObjSource = new File(project.projectDir, 'art/lili_source.obj')
def liliMeshPreviewDir = new File(project.projectDir, 'build/lili-texture-preview')
def liliMeshRestore = project.hasProperty('liliRestoreMesh')

/** 生成的 OBJ 首部注释:出处 + 修改声明(必须随文件走,MIT 要求保留版权与修改说明)。 */
static List<String> meshHeader() {
    return [
            '# Reused from Slashblade-Murasame (assets/murasame/models/murasame/murasamemaru.obj)',
            '# License: MIT, Copyright (c) 2025 CeliaClaire -- see THIRD-PARTY-NOTICES.md',
            '# Modified: 301 faces of sheath accessories (two metal rings + kurikata + sageo cord) were removed.',
            '#           Geometry and UVs are otherwise UNCHANGED from the original.',
            '#           Generated by tools/lili-mesh.gradle (gradlew generateLiliMesh); original kept in art/lili_source.obj',
    ]
}

tasks.register('generateLiliMesh') {
    group = 'applied slash tooling'
    description = '把鞘壳重做成 16×24 圆柱 + 删掉鞘上的配件 + 全组 UV 重排到 1024×2048 图集'
    notCompatibleWithConfigurationCache('本任务在 doLast 里读写资源文件')

    doLast {
        if (liliMeshRestore) {
            def src = liliObjSource.readLines('UTF-8')
            def body = src.dropWhile { it.startsWith('#') }
            liliObjTarget.setText((meshHeader() + body).join('\n') + '\n', 'UTF-8')
            println '===== generateLiliMesh ====='
            println "  已还原成 ${liliObjSource}(丛雨丸原始几何:三棱柱壳 + 配件面集;贴图布局也回到 1:1)"
            return
        }
        if (!liliObjSource.isFile()) {
            throw new GradleException("缺少原始模型存档 ${liliObjSource}(重建与回滚都依赖它)")
        }

        def srcLines = liliObjSource.readLines('UTF-8')
        def body = srcLines.dropWhile { it.startsWith('#') }
        def facesByGroup = LiliMesh.readFaces(body)
        def verts = LiliMesh.readVertices(body)
        def vLines = body.findAll { it.startsWith('v ') }
        def vtLines = body.findAll { it.startsWith('vt ') }

        // ---- 1) 拟合原壳 ----
        def shellComps = LiliMesh.components(facesByGroup['sheath'] ?: [], verts)
        if (shellComps.isEmpty()) {
            throw new GradleException('sheath 组没有任何面:源模型不对?')
        }
        def shell = shellComps.max { a, b -> (a[0].maxX - a[0].minX) <=> (b[0].maxX - b[0].minX) }
        // 回退版(用户要求):只删掉鞘上的配件面集,**保持原壳几何与原 UV 不变**。
        // 圆柱化那套(ShellFit/CylinderShell + UV 图集重排)代码保留在文件里备用,但默认不启用。
        def keepLines = [] as Set
        shell.each { face -> keepLines << face.lineIndex }
        int droppedFaces = (facesByGroup['sheath'] ?: []).size() - shell.size()

        // ---- 组装 OBJ:原样拷贝 v/vt/各组面,只把 sheath 组里不属于"整根壳"的面丢掉 ----
        def out = []
        String current = null
        body.eachWithIndex { line, idx ->
            if (line.startsWith('g ')) {
                current = line.substring(2).trim()
                out << line
                return
            }
            if (line.startsWith('f ') && current == 'sheath') {
                if (keepLines.contains(idx)) {
                    out << line
                }
                return
            }
            if (line.startsWith('v ') || line.startsWith('vt ') || line.startsWith('f ')
                    || line.startsWith('vn ') || line.startsWith('usemtl ') || line.startsWith('s ')) {
                out << line
            }
        }

        liliObjTarget.setText((meshHeader() + out).join('\n') + '\n', 'UTF-8')

        // ---- 统计 ----
        def after = liliObjTarget.readLines('UTF-8')
        def afterFaces = LiliMesh.readFaces(after)
        println '===== generateLiliMesh(回退版:只删配件,不动几何与 UV)====='
        println "  源文件      : ${liliObjSource}(${liliObjSource.length()} B,不可变)"
        println "  产物        : ${liliObjTarget}(${liliObjTarget.length()} B)"
        println String.format(Locale.ROOT, '  保留的鞘壳  : %d 面,X[%.1f, %.1f](跨度 %.1f)',
                shell.size(), shell[0].minX, shell[0].maxX, shell[0].maxX - shell[0].minX)
        println "  删除的配件  : ${droppedFaces} 面(金属环 ×2 + 栗形 + 下绪)"
        println '  各组面数(原 → 新):'
        def groups0 = ['blade', 'blade_damaged', 'blade_fragment', 'effect', 'sheath',
                       'item_blade', 'item_bladens', 'item_damaged']
        groups0.each { g ->
            int before = (facesByGroup[g] ?: []).size()
            int now = (afterFaces[g] ?: []).size()
            println String.format(Locale.ROOT, '    %-15s %4d → %4d %s', g, before, now,
                    before == now ? (g == 'sheath' ? '(删配件后)' : '(不变)') : '(!! 面数变了)')
        }
        println '===== 结束(断言在 verifyResources:连通块 1 / X 跨度 ≥ 250 / 其余 7 组面数不变)====='
    }
}

